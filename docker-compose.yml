services:
  denboard:
    build: .
    container_name: denboard
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      # data/denboard.json (config, hot-reloaded) lives here. A V1 data/settings.json is imported on first run.
      - ./data:/app/data
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - HOME_ASSISTANT_URL=${HOME_ASSISTANT_URL:-}
      - HOME_ASSISTANT_TOKEN=${HOME_ASSISTANT_TOKEN:-}
      - GCAL_ICS_URL=${GCAL_ICS_URL:-}
      - DASHBOARD_LAT=${DASHBOARD_LAT:-}
      - DASHBOARD_LON=${DASHBOARD_LON:-}
      - DASHBOARD_TZ=${DASHBOARD_TZ:-America/Denver}
      - WEATHER_UNITS=${WEATHER_UNITS:-imperial}
      - DENBOARD_FRAME_ANCESTORS=${DENBOARD_FRAME_ANCESTORS:-}
      - DENBOARD_DEMO=${DENBOARD_DEMO:-}
